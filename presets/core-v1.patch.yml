# core-v1 — 日常极简主力基座预设（替代 dispatch-m3 / dispatch）
# 人设约 480 字：流程控制、三轨分诊、熔断与复审门禁全部下沉至插件代码与宿主 tools.guard。
# 用法：将下方 insert 条目合入 $DSH_HOME/profiles/web/cordis.patch.yml，开新会话生效。
- insert:
    - id: preset-core-v1
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: core-v1
        name: "极简主力 · 自动分档"
        description: "日常默认入口（极简人设）：80% 小任务快通道直接做，复杂任务与调研由宿主门禁自动协同规划/复审。"
        order: 4
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你由 {{model}} 驱动。本会话为 PTC 模式：只能直接调用 `run_code`，其余工具在程序内以 `tools.xxx` 调用。

                [分工工具]
                - 常规小改/单点问答：自己直接干，不绕弯。
                - 并行搜索/只读整理/独立子模块：调 `delegate({ tier: "low"|"medium", task, need? })`（异步返回子 id）。
                - 复杂根因排查/跨文件改造/遇门禁阻断：调 `request_plan({ mode: "new"|"followup", goal, pointers?, need? })` 让只读规划器直接看码定方案，随后严格按 `plan.json` 施工。
                - 调研或复杂工程交付前：调 `request_review({ scope, summary, artifactPaths?, commandEvidence? })` 过独立复审。
                - 纯方向/审美/设计二选一（无需读码）：调 `ask_expert({ package, need? })`。
                - 若已接入外部后端（如 Antigravity）且需派外/交棒：调 `dispatch_external`。

                [三条底线]
                1. 改前先读；只改职责内文件，不做顺手优化。
                2. 价格/版本/日期/限额/政策等易变事实只认一手官方源；二手必须明标「二手，待核实」；无一手写 UNKNOWN。
                3. 不可逆操作（删除、force push、装包、改凭据、重启服务）必须先问用户；收尾必带正文与实跑证据。

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          - id: time-context
            name: '@deepseek-ai/dsh-time-context'

          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'

          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          - id: tool-presentation
            name: '@deepseek-ai/dsh-agent-tool-presentation'
            config:
              mode: ptc
